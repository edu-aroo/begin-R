<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="RStudio Global Options, Git/SVN" font-family="Segoe UI, Source Sans 3, Arial, Helvetica, sans-serif">
<rect x="20" y="20" width="640" height="360" rx="8" fill="#fff" stroke="#8a969c" stroke-width="1.5"/><rect x="20" y="20" width="640" height="32" rx="8" fill="#f3f3f3"/><rect x="20" y="44" width="640" height="8" fill="#f3f3f3"/><line x1="20" y1="52" x2="660" y2="52" stroke="#dcdcdc"/><rect x="32" y="29" width="14" height="14" rx="3" fill="#75aadb"/><text x="54" y="41" font-size="13" fill="#222">Options</text><text x="556" y="41" font-size="13" fill="#333">&#x2014;</text><rect x="594" y="31" width="10" height="10" fill="none" stroke="#333"/><text x="632" y="42" font-size="15" fill="#333">&#x2715;</text><text x="40" y="74" font-size="12.5" fill="#222">General</text><text x="40" y="93" font-size="12.5" fill="#222">Code</text><text x="40" y="112" font-size="12.5" fill="#222">Console</text><text x="40" y="131" font-size="12.5" fill="#222">Appearance</text><text x="40" y="150" font-size="12.5" fill="#222">Pane Layout</text><text x="40" y="169" font-size="12.5" fill="#222">Packages</text><text x="40" y="188" font-size="12.5" fill="#222">R Markdown</text><text x="40" y="207" font-size="12.5" fill="#222">Python</text><text x="40" y="226" font-size="12.5" fill="#222">Sweave</text><text x="40" y="245" font-size="12.5" fill="#222">Spelling</text><rect x="28" y="250" width="130" height="20" fill="#cce4f7"/><text x="40" y="264" font-size="12.5" fill="#222">Git/SVN</text><text x="40" y="283" font-size="12.5" fill="#222">Publishing</text><text x="40" y="302" font-size="12.5" fill="#222">Terminal</text><text x="40" y="321" font-size="12.5" fill="#222">Accessibility</text><text x="40" y="340" font-size="12.5" fill="#222">Copilot</text><line x1="165" y1="52" x2="165" y2="372" stroke="#ddd"/><rect x="182" y="62" width="14" height="14" rx="2" fill="#0067c0" stroke="#555"/><path d="M185 69 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/><text x="204" y="74" font-size="12.5" fill="#222">Enable version control interface for RStudio projects</text><text x="182" y="102" font-size="12.5" fill="#333">Git executable:</text><rect x="182" y="108" width="330" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="190" y="125" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">C:/Program Files/Git/bin/git.exe</text><rect x="522" y="108" width="70" height="26" rx="4" fill="#fff" stroke="#b5b5b5"/><text x="557.0" y="125" text-anchor="middle" font-size="12.5" fill="#222">Browse...</text><text x="182" y="154" font-size="12.5" fill="#333">SVN executable:</text><rect x="182" y="160" width="330" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="190" y="177" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">(Not Found)</text><text x="182" y="226" font-size="12.5" fill="#0067c0" text-decoration="underline">Create SSH Key...</text><rect x="450" y="340" width="64" height="26" rx="4" fill="#0067c0" stroke="#0067c0"/><text x="482.0" y="357" text-anchor="middle" font-size="12.5" fill="#fff">OK</text><rect x="520" y="340" width="64" height="26" rx="4" fill="#fff" stroke="#b5b5b5"/><text x="552.0" y="357" text-anchor="middle" font-size="12.5" fill="#222">Cancel</text><rect x="590" y="340" width="60" height="26" rx="4" fill="#fff" stroke="#b5b5b5"/><text x="620.0" y="357" text-anchor="middle" font-size="12.5" fill="#222">Apply</text><circle cx="150" cy="260" r="11" fill="#d9694a"/><text x="150" y="264.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><circle cx="600" cy="121" r="11" fill="#d9694a"/><text x="600" y="125.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><circle cx="690" cy="70" r="11" fill="#d9694a"/><text x="690" y="74.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text class="en" x="708" y="75" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Tools → Global Options… → Git/SVN</tspan></text><text class="fr" x="708" y="75" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Tools → Global Options… → Git/SVN</tspan></text><circle cx="690" cy="120" r="11" fill="#d9694a"/><text x="690" y="124.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text class="en" x="708" y="125" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Path to git.exe: filled automatically</tspan><tspan x="708" dy="16">after installing Git for Windows.</tspan><tspan x="708" dy="16">Empty? Browse to C:/Program Files/Git/bin/</tspan><tspan x="708" dy="16">then restart RStudio.</tspan></text><text class="fr" x="708" y="125" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Chemin de git.exe : rempli tout seul</tspan><tspan x="708" dy="16">après installation de Git for Windows.</tspan><tspan x="708" dy="16">Vide ? Browse vers C:/Program Files/Git/bin/</tspan><tspan x="708" dy="16">puis redémarrez RStudio.</tspan></text><circle cx="690" cy="230" r="11" fill="#d9694a"/><text x="690" y="234.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text class="en" x="708" y="235" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Tools → Global Options… → Terminal:</tspan><tspan x="708" dy="16">&quot;New terminals open with: Git Bash&quot;</tspan></text><text class="fr" x="708" y="235" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Tools → Global Options… → Terminal :</tspan><tspan x="708" dy="16">« New terminals open with: Git Bash »</tspan></text><circle cx="150" cy="298" r="11" fill="#d9694a"/><text x="150" y="302.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
</svg>
