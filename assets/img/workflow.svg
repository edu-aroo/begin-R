<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" role="img" aria-label="Data analysis workflow" font-family="Source Sans 3, Arial, sans-serif">
<defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d5c"/></marker></defs>
<g stroke-width="2"><rect x="10" y="40" width="150" height="80" rx="10" fill="#fdf0eb" stroke="#d9694a"/><rect x="185" y="40" width="150" height="80" rx="10" fill="#f6f1e7" stroke="#b08a4a"/><rect x="360" y="40" width="150" height="80" rx="10" fill="#e9f4f6" stroke="#1b7f8c"/><rect x="535" y="40" width="150" height="80" rx="10" fill="#eef5ea" stroke="#4a7d3a"/><rect x="710" y="40" width="140" height="80" rx="10" fill="#0b3d5c" stroke="#0b3d5c"/></g>
<g stroke="#0b3d5c" stroke-width="2" marker-end="url(#ar2)"><path d="M160 80h22"/><path d="M335 80h22"/><path d="M510 80h22"/><path d="M685 80h22"/></g>
<g font-size="15" font-weight="700" text-anchor="middle"><text x="85" y="72" fill="#d9694a" class="en">1. Raw data</text><text x="85" y="72" fill="#d9694a" class="fr">1. Données brutes</text><text x="260" y="72" fill="#8a6a32" class="en">2. Clean</text><text x="260" y="72" fill="#8a6a32" class="fr">2. Nettoyer</text><text x="435" y="72" fill="#1b7f8c" class="en">3. Database</text><text x="435" y="72" fill="#1b7f8c" class="fr">3. Base de données</text><text x="610" y="72" fill="#4a7d3a" class="en">4. Summarise</text><text x="610" y="72" fill="#4a7d3a" class="fr">4. Résumer</text><text x="780" y="72" fill="#fff" class="en">5. Graph</text><text x="780" y="72" fill="#fff" class="fr">5. Graphique</text></g>
<g font-size="13" text-anchor="middle" font-family="JetBrains Mono, monospace" fill="#3c4a52"><text x="85" y="100">read.csv()</text><text x="260" y="100">trimws() gsub()</text><text x="435" y="100">tapply()</text><text x="610" y="100">mean() sd()</text><text x="780" y="100" fill="#cfe3ea">barplot()</text></g>
<text class="en" x="430" y="155" text-anchor="middle" font-size="15" fill="#5d6b75">Every step is written in a script, so the whole analysis can be re-run in one click.</text>
<text class="fr" x="430" y="155" text-anchor="middle" font-size="15" fill="#5d6b75">Chaque étape est écrite dans un script : toute l'analyse peut être relancée en un clic.</text>
</svg>
