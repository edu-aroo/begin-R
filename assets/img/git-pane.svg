/text><text x="430" y="104" font-size="12.5" fill="#333">⎇ main ▾</text><text x="545" y="104" font-size="14" fill="#333">⟳</text><text x="40" y="142" font-size="12" fill="#5d6b75">Staged</text><text x="100" y="142" font-size="12" fill="#5d6b75">Status</text><text x="160" y="142" font-size="12" fill="#5d6b75">Path</text><rect x="44" y="152" width="14" height="14" fill="#fff" stroke="#555"/><rect x="104" y="151" width="18" height="17" rx="3" fill="#c27a00"/><text x="113" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">M</text><text x="160" y="164" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">R/02_clean.R</text><rect x="44" y="178" width="14" height="14" fill="#0067c0" stroke="#555"/><path d="M47 185 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/><rect x="104" y="177" width="18" height="17" rx="3" fill="#2f855a"/><text x="113" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">A</text><text x="160" y="190" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">R/03_analysis.R</text><rect x="44" y="204" width="14" height="14" fill="#fff" stroke="#555"/><rect x="104" y="203" width="18" height="17" rx="3" fill="#c53030"/><text x="113" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">D</text><text x="160" y="216" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">R/old_test.R</text><rect x="44" y="230" width="14" height="14" fill="#fff" stroke="#555"/><rect x="104" y="229" width="18" height="17" rx="3" fill="#7b8a93"/><text x="113" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">?</text><text x="160" y="242" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">notes_field.txt</text><rect x="44" y="256" width="14" height="14" fill="#fff" stroke="#555"/><rect x="104" y="255" width="18" height="17" rx="3" fill="#6b46c1"/><text x="113" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">R</text><text x="160" y="268" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">R/01_import.R ← import.R</text><circle cx="64" cy="122" r="11" fill="#d9694a"/><text x="64" y="126.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><circle cx="196" cy="122" r="11" fill="#d9694a"/><text x="196" y="126.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><circle cx="300" cy="122" r="11" fill="#d9694a"/><text x="300" y="126.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><circle cx="500" cy="122" r="11" fill="#d9694a"/><text x="500" y="126.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><circle cx="84" cy="284" r="11" fill="#d9694a"/><text x="84" y="288.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text><circle cx="610" cy="50" r="11" fill="#d9694a"/><text x="610" y="54.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text class="en" x="628" y="55" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="628" dy="0">Diff / Commit: open the Review Changes window.</tspan></text><text class="fr" x="628" y="55" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="628" dy="0">Diff / Commit : ouvrent la fenêtre Review Changes.</tspan></text><circle cx="610" cy="90" r="11" fill="#d9694a"/><text x="610" y="94.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text class="en" x="628" y="95" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="628" dy="0">Pull (blue): get the commits of the others.</tspan><tspan x="628" dy="16">Push (green): send your commits online.</tspan></text><text class="fr" x="628" y="95" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="628" dy="0">Pull (bleu) : récupérer les commits des autres.</tspan><tspan x="628" dy="16">Push (vert) : envoyer vos commits en ligne.</tspan></text><circle cx="610" cy="145" r="11" fill="#d9694a"/><text x="610" y="149.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text class="en" x="628" y="150" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="628" dy="0">History: every commit; More ▾: Revert,</tspan><tspan x="628" dy="16">Ignore, Shell… (right-click works too).</tspan></text><text class="fr" x="628" y="150" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="628" dy="0">History : tous les commits ; More ▾ : Revert,</tspan><tspan x="628" dy="16">Ignore, Shell… (le clic droit marche aussi).</tspan></text><circle cx="610" cy="200" r="11" fill="#d9694a"/><text x="610" y="204.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text class="en" x="628" y="205" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="628" dy="0">Current branch; the menu creates or</tspan><tspan x="628" dy="16">changes branch.</tspan></text><text class="fr" x="628" y="205" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="628" dy="0">Branche actuelle ; le menu crée ou</tspan><tspan x="628" dy="16">change de branche.</tspan></text><circle cx="610" cy="255" r="11" fill="#d9694a"/><text x="610" y="259.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text><text class="en" x="628" y="260" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="628" dy="0">Status: M modified · A added (new, staged) ·</tspan><tspan x="628" dy="16">D deleted · ? not followed yet (untracked) ·</tspan><tspan x="628" dy="16">R renamed. Tick &quot;Staged&quot; to put a change</tspan><tspan x="628" dy="16">in the next commit.</tspan></text><text class="fr" x="628" y="260" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="628" dy="0">Statut : M modifié · A ajouté (nouveau, indexé) ·</tspan><tspan x="628" dy="16">D supprimé · ? pas encore suivi (untracked) ·</tspan><tspan x="628" dy="16">R renommé. Cochez « Staged » pour mettre une</tspan><tspan x="628" dy="16">modification dans le prochain commit.</tspan></text>
</svg>
