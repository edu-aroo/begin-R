<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" role="img" aria-label="RStudio New Project Wizard: clone a Git repository" font-family="Segoe UI, Source Sans 3, Arial, Helvetica, sans-serif">
<rect x="20" y="20" width="300" height="300" rx="8" fill="#fff" stroke="#8a969c" stroke-width="1.5"/><rect x="20" y="20" width="300" height="32" rx="8" fill="#f3f3f3"/><rect x="20" y="44" width="300" height="8" fill="#f3f3f3"/><line x1="20" y1="52" x2="320" y2="52" stroke="#dcdcdc"/><rect x="32" y="29" width="14" height="14" rx="3" fill="#75aadb"/><text x="54" y="41" font-size="13" fill="#222">New Project Wizard</text><text x="216" y="41" font-size="13" fill="#333">&#x2014;</text><rect x="254" y="31" width="10" height="10" fill="none" stroke="#333"/><text x="292" y="42" font-size="15" fill="#333">&#x2715;</text><text x="40" y="82" font-size="14" font-weight="600" fill="#222">Create Project</text><rect x="40" y="100" width="260" height="46" rx="4" fill="#fff" stroke="#ccc"/><text x="58" y="128" font-size="13.5" fill="#222">New Directory</text><rect x="40" y="156" width="260" height="46" rx="4" fill="#fff" stroke="#ccc"/><text x="58" y="184" font-size="13.5" fill="#222">Existing Directory</text><rect x="40" y="212" width="260" height="46" rx="4" fill="#cce4f7" stroke="#ccc"/><text x="58" y="240" font-size="13.5" fill="#222">Version Control</text><text x="340" y="180" font-size="26" fill="#5d6b75">→</text><rect x="370" y="20" width="300" height="300" rx="8" fill="#fff" stroke="#8a969c" stroke-width="1.5"/><rect x="370" y="20" width="300" height="32" rx="8" fill="#f3f3f3"/><rect x="370" y="44" width="300" height="8" fill="#f3f3f3"/><line x1="370" y1="52" x2="670" y2="52" stroke="#dcdcdc"/><rect x="382" y="29" width="14" height="14" rx="3" fill="#75aadb"/><text x="404" y="41" font-size="13" fill="#222">New Project Wizard</text><text x="566" y="41" font-size="13" fill="#333">&#x2014;</text><rect x="604" y="31" width="10" height="10" fill="none" stroke="#333"/><text x="642" y="42" font-size="15" fill="#333">&#x2715;</text><text x="390" y="82" font-size="14" font-weight="600" fill="#222">Create Project from Version Control</text><rect x="390" y="100" width="260" height="46" rx="4" fill="#cce4f7" stroke="#ccc"/><text x="408" y="128" font-size="13.5" fill="#222">Git</text><rect x="390" y="156" width="260" height="46" rx="4" fill="#fff" stroke="#ccc"/><text x="408" y="184" font-size="13.5" fill="#222">Subversion</text><text x="690" y="180" font-size="26" fill="#5d6b75">→</text><rect x="720" y="20" width="420" height="300" rx="8" fill="#fff" stroke="#8a969c" stroke-width="1.5"/><rect x="720" y="20" width="420" height="32" rx="8" fill="#f3f3f3"/><rect x="720" y="44" width="420" height="8" fill="#f3f3f3"/><line x1="720" y1="52" x2="1140" y2="52" stroke="#dcdcdc"/><rect x="732" y="29" width="14" height="14" rx="3" fill="#75aadb"/><text x="754" y="41" font-size="13" fill="#222">New Project Wizard</text><text x="1036" y="41" font-size="13" fill="#333">&#x2014;</text><rect x="1074" y="31" width="10" height="10" fill="none" stroke="#333"/><text x="1112" y="42" font-size="15" fill="#333">&#x2715;</text><text x="740" y="82" font-size="14" font-weight="600" fill="#222">Clone Git Repository</text><text x="740" y="106" font-size="12.5" fill="#333">Repository URL:</text><rect x="740" y="112" width="380" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="748" y="129" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">https://github.com/fara-rasoa/reef-monitoring.git</text><text x="740" y="160" font-size="12.5" fill="#333">Project directory name:</text><rect x="740" y="166" width="380" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="748" y="183" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">reef-monitoring</text><text x="740" y="214" font-size="12.5" fill="#333">Create project as subdirectory of:</text><rect x="740" y="220" width="300" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="748" y="237" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">~/Documents/R</text><rect x="1048" y="220" width="72" height="26" rx="4" fill="#fff" stroke="#b5b5b5"/><text x="1084.0" y="237" text-anchor="middle" font-size="12.5" fill="#222">Browse...</text><rect x="740" y="262" width="14" height="14" rx="2" fill="#fff" stroke="#555"/><text x="762" y="274" font-size="12.5" fill="#222">Open in new session</text><rect x="930" y="288" width="110" height="26" rx="4" fill="#0067c0" stroke="#0067c0"/><text x="985.0" y="305" text-anchor="middle" font-size="12.5" fill="#fff">Create Project</text><rect x="1048" y="288" width="72" height="26" rx="4" fill="#fff" stroke="#b5b5b5"/><text x="1084.0" y="305" text-anchor="middle" font-size="12.5" fill="#222">Cancel</text><circle cx="30" cy="345" r="11" fill="#d9694a"/><text x="30" y="349.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text class="en" x="48" y="350" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="48" dy="0">File → New Project… → Version Control</tspan></text><text class="fr" x="48" y="350" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="48" dy="0">File → New Project… → Version Control</tspan></text><circle cx="380" cy="345" r="11" fill="#d9694a"/><text x="380" y="349.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text class="en" x="398" y="350" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="398" dy="0">→ Git</tspan></text><text class="fr" x="398" y="350" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="398" dy="0">→ Git</tspan></text><circle cx="730" cy="345" r="11" fill="#d9694a"/><text x="730" y="349.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text class="en" x="748" y="350" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="748" dy="0">Paste the HTTPS address; the folder name fills itself;</tspan><tspan x="748" dy="16">choose where to store it (avoid OneDrive folders);</tspan><tspan x="748" dy="16">Create Project: RStudio downloads (clones) the</tspan><tspan x="748" dy="16">repository and opens it as an R project with a Git tab.</tspan></text><text class="fr" x="748" y="350" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="748" dy="0">Collez l&#x27;adresse HTTPS ; le nom du dossier se remplit seul ;</tspan><tspan x="748" dy="16">choisissez où le ranger (évitez les dossiers OneDrive) ;</tspan><tspan x="748" dy="16">Create Project : RStudio télécharge (clone) le</tspan><tspan x="748" dy="16">dépôt et l&#x27;ouvre comme projet R avec un onglet Git.</tspan></text>
</svg>
