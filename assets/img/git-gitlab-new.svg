<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 510" role="img" aria-label="Create a blank project on GitLab" font-family="Segoe UI, Source Sans 3, Arial, Helvetica, sans-serif">
<rect x="20" y="20" width="640" height="470" rx="8" fill="#fff" stroke="#8a969c" stroke-width="1.5"/><rect x="20" y="20" width="640" height="32" rx="8" fill="#f3f3f3"/><rect x="20" y="44" width="640" height="8" fill="#f3f3f3"/><line x1="20" y1="52" x2="660" y2="52" stroke="#dcdcdc"/><rect x="32" y="29" width="14" height="14" rx="3" fill="#fc6d26"/><text x="54" y="41" font-size="13" fill="#222">Create blank project · GitLab — Microsoft Edge</text><text x="556" y="41" font-size="13" fill="#333">&#x2014;</text><rect x="594" y="31" width="10" height="10" fill="none" stroke="#333"/><text x="632" y="42" font-size="15" fill="#333">&#x2715;</text><rect x="21" y="53" width="638" height="30" fill="#fafafa"/><text x="40" y="73" font-size="12" fill="#57606a">gitlab.com/projects/new#blank_project</text><text x="50" y="112" font-size="20" font-weight="600" fill="#28272d">Create blank project</text><text x="50" y="142" font-size="12.5" fill="#333">Project name</text><rect x="50" y="148" width="412" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="58" y="165" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">reef-monitoring</text><text x="50" y="198" font-size="12.5" fill="#333">Project URL</text><rect x="50" y="204" width="200" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="58" y="221" font-size="12.5" fill="#111" >gitlab.com/fara-rasoa/ ▾</text><text x="262" y="198" font-size="12.5" fill="#333">Project slug</text><rect x="262" y="204" width="200" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="270" y="221" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">reef-monitoring</text><text x="50" y="258" font-size="12.5" fill="#333">Visibility Level</text><circle cx="57" cy="275" r="7" fill="#fff" stroke="#555"/><circle cx="57" cy="275" r="3.5" fill="#0067c0"/><text x="72" y="280" font-size="12.5" fill="#222">Private</text><circle cx="57" cy="299" r="7" fill="#fff" stroke="#555"/><text x="72" y="304" font-size="12.5" fill="#222">Internal</text><circle cx="57" cy="323" r="7" fill="#fff" stroke="#555"/><text x="72" y="328" font-size="12.5" fill="#222">Public</text><text x="50" y="358" font-size="12.5" fill="#333">Project Configuration</text><rect x="50" y="368" width="14" height="14" rx="2" fill="#0067c0" stroke="#555"/><path d="M53 375 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/><text x="72" y="380" font-size="12.5" fill="#222">Initialize repository with a README</text><rect x="50" y="410" width="140" height="26" rx="4" fill="#1f75cb" stroke="#1f75cb"/><text x="120.0" y="427" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="600">Create project</text><rect x="200" y="410" width="80" height="26" rx="4" fill="#fff" stroke="#b5b5b5"/><text x="240.0" y="427" text-anchor="middle" font-size="12.5" fill="#222">Cancel</text><circle cx="480" cy="160" r="11" fill="#d9694a"/><text x="480" y="164.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><circle cx="480" cy="290" r="11" fill="#d9694a"/><text x="480" y="294.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><circle cx="480" cy="376" r="11" fill="#d9694a"/><text x="480" y="380.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><circle cx="300" cy="423" r="11" fill="#d9694a"/><text x="300" y="427.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><circle cx="690" cy="120" r="11" fill="#d9694a"/><text x="690" y="124.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text class="en" x="708" y="125" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">New project (+ button) → Create blank project.</tspan><tspan x="708" dy="16">The slug is the folder and the address.</tspan></text><text class="fr" x="708" y="125" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">New project (bouton +) → Create blank project.</tspan><tspan x="708" dy="16">Le slug est le dossier et l&#x27;adresse.</tspan></text><circle cx="690" cy="205" r="11" fill="#d9694a"/><text x="690" y="209.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text class="en" x="708" y="210" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Private projects can still have a website</tspan><tspan x="708" dy="16">(GitLab Pages, Session A9).</tspan></text><text class="fr" x="708" y="210" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Un projet privé peut quand même avoir un site</tspan><tspan x="708" dy="16">(GitLab Pages, séance A9).</tspan></text><circle cx="690" cy="270" r="11" fill="#d9694a"/><text x="690" y="274.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text class="en" x="708" y="275" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Tick it: the project can be cloned at once.</tspan><tspan x="708" dy="16">Add the .gitignore later from RStudio.</tspan></text><text class="fr" x="708" y="275" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Cochez : le projet peut être cloné tout de suite.</tspan><tspan x="708" dy="16">Ajoutez le .gitignore ensuite depuis RStudio.</tspan></text><circle cx="690" cy="335" r="11" fill="#d9694a"/><text x="690" y="339.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text class="en" x="708" y="340" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Then Code ▾ → Clone with HTTPS → copy</tspan><tspan x="708" dy="16">https://gitlab.com/fara-rasoa/reef-monitoring.git</tspan></text><text class="fr" x="708" y="340" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Puis Code ▾ → Clone with HTTPS → copiez</tspan><tspan x="708" dy="16">https://gitlab.com/fara-rasoa/reef-monitoring.git</tspan></text>
</svg>
