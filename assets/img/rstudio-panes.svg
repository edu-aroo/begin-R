<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-label="The four panes of RStudio" font-family="Source Sans 3, Arial, sans-serif">
<rect x="10" y="10" width="840" height="450" rx="12" fill="#f2f4f5" stroke="#9aa7ae" stroke-width="2"/>
<rect x="10" y="10" width="840" height="30" rx="12" fill="#d7dde0"/><circle cx="32" cy="25" r="6" fill="#d9694a"/><circle cx="52" cy="25" r="6" fill="#e3b04b"/><circle cx="72" cy="25" r="6" fill="#4a7d3a"/>
<text x="430" y="31" text-anchor="middle" font-size="15" fill="#3c4a52">RStudio</text>
<rect x="22" y="50" width="490" height="210" rx="8" fill="#fff" stroke="#1b7f8c" stroke-width="2.5"/>
<rect x="22" y="270" width="490" height="180" rx="8" fill="#fff" stroke="#0b3d5c" stroke-width="2.5"/>
<rect x="522" y="50" width="316" height="170" rx="8" fill="#fff" stroke="#b08a4a" stroke-width="2.5"/>
<rect x="522" y="230" width="316" height="220" rx="8" fill="#fff" stroke="#4a7d3a" stroke-width="2.5"/>
<text x="40" y="80" font-size="20" font-weight="700" fill="#1b7f8c">1 · Source / Script</text>
<text x="40" y="300" font-size="20" font-weight="700" fill="#0b3d5c">2 · Console</text>
<text x="540" y="80" font-size="20" font-weight="700" fill="#b08a4a">3 · Environment</text>
<text x="540" y="260" font-size="20" font-weight="700" fill="#4a7d3a">4 · Files / Plots / Help</text>
<g font-family="JetBrains Mono, monospace" font-size="14" fill="#3c4a52"><text x="40" y="112"># my_script.R</text><text x="40" y="134">cover &lt;- c(45, 60, 12)</text><text x="40" y="156">mean(cover)</text><text x="40" y="332">&gt; mean(cover)</text><text x="40" y="354">[1] 39</text><text x="40" y="376">&gt; |</text><text x="540" y="112">cover   num [1:3] 45 60 12</text></g>
<g font-size="15" fill="#5d6b75">
<text class="en" x="40" y="200"><tspan x="40">Where you WRITE and SAVE your code (.R file).</tspan><tspan x="40" dy="20">Run a line with Ctrl + Enter (Cmd + Enter on Mac).</tspan></text>
<text class="fr" x="40" y="200"><tspan x="40">Où l'on ÉCRIT et ENREGISTRE son code (fichier .R).</tspan><tspan x="40" dy="20">Exécuter une ligne : Ctrl + Entrée (Cmd + Entrée sur Mac).</tspan></text>
<text class="en" x="40" y="410"><tspan x="40">Where R RUNS the code and prints results.</tspan><tspan x="40" dy="20">Nothing typed here is saved.</tspan></text>
<text class="fr" x="40" y="410"><tspan x="40">Où R EXÉCUTE le code et affiche les résultats.</tspan><tspan x="40" dy="20">Rien de ce qui est tapé ici n'est enregistré.</tspan></text>
<text class="en" x="540" y="150"><tspan x="540">The objects currently in memory</tspan><tspan x="540" dy="20">(data, vectors, results).</tspan></text>
<text class="fr" x="540" y="150"><tspan x="540">Les objets actuellement en mémoire</tspan><tspan x="540" dy="20">(données, vecteurs, résultats).</tspan></text>
<text class="en" x="540" y="300"><tspan x="540">Files of your project, your graphs,</tspan><tspan x="540" dy="20">installed packages and the help pages.</tspan></text>
<text class="fr" x="540" y="300"><tspan x="540">Fichiers du projet, graphiques,</tspan><tspan x="540" dy="20">packages installés et pages d'aide.</tspan></text>
</g>
<g transform="translate(600,350)"><rect x="0" y="0" width="22" height="60" fill="#4a7d3a" opacity=".8"/><rect x="34" y="20" width="22" height="40" fill="#4a7d3a" opacity=".6"/><rect x="68" y="35" width="22" height="25" fill="#4a7d3a" opacity=".45"/><path d="M-6 62h110" stroke="#5d6b75"/></g>
</svg>
