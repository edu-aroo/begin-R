<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 185" role="img" aria-label="The daily Git cycle in RStudio" font-family="Segoe UI, Source Sans 3, Arial, Helvetica, sans-serif">
<rect x="20" y="40" width="205" height="70" rx="12" fill="#fff" stroke="#2b6cb0" stroke-width="2.5"/><text x="122" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#2b6cb0">⬇ Pull</text><text class="en" x="122" y="96" text-anchor="middle" font-size="12" fill="#5d6b75">when you start working</text><text class="fr" x="122" y="96" text-anchor="middle" font-size="12" fill="#5d6b75">quand vous commencez</text><text x="232" y="82" font-size="20" fill="#5d6b75">→</text><rect x="255" y="40" width="205" height="70" rx="12" fill="#fff" stroke="#3c4a52" stroke-width="2.5"/><text x="357" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#3c4a52">✎ Edit, save, run</text><text class="en" x="357" y="96" text-anchor="middle" font-size="12" fill="#5d6b75">your scripts and reports</text><text class="fr" x="357" y="96" text-anchor="middle" font-size="12" fill="#5d6b75">vos scripts et rapports</text><text x="467" y="82" font-size="20" fill="#5d6b75">→</text><rect x="490" y="40" width="205" height="70" rx="12" fill="#fff" stroke="#c27a00" stroke-width="2.5"/><text x="592" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#c27a00">✔ Stage + Commit</text><text class="en" x="592" y="96" text-anchor="middle" font-size="12" fill="#5d6b75">after each logical step that works</text><text class="fr" x="592" y="96" text-anchor="middle" font-size="12" fill="#5d6b75">après chaque étape logique qui marche</text><text x="702" y="82" font-size="20" fill="#5d6b75">→</text><rect x="725" y="40" width="205" height="70" rx="12" fill="#fff" stroke="#2f855a" stroke-width="2.5"/><text x="827" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#2f855a">⬆ Push</text><text class="en" x="827" y="96" text-anchor="middle" font-size="12" fill="#5d6b75">end of session (Pull just before)</text><text class="fr" x="827" y="96" text-anchor="middle" font-size="12" fill="#5d6b75">fin de séance (Pull juste avant)</text><path d="M 125 112 C 125 160, 830 160, 830 112" fill="none" stroke="#5d6b75" stroke-dasharray="5 4"/><text class="en" x="477" y="168" text-anchor="middle" font-size="12.5" fill="#5d6b75">Commit often (many small commits) · push at least once per work session · always pull before pushing</text><text class="fr" x="477" y="168" text-anchor="middle" font-size="12.5" fill="#5d6b75">Validez souvent (beaucoup de petits commits) · poussez au moins une fois par séance de travail · toujours pull avant push</text>
</svg>
