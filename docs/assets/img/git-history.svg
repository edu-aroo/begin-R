<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" role="img" aria-label="RStudio Git history viewer" font-family="Segoe UI, Source Sans 3, Arial, Helvetica, sans-serif">
<rect x="20" y="20" width="820" height="380" rx="8" fill="#fff" stroke="#8a969c" stroke-width="1.5"/><rect x="20" y="20" width="820" height="32" rx="8" fill="#f3f3f3"/><rect x="20" y="44" width="820" height="8" fill="#f3f3f3"/><line x1="20" y1="52" x2="840" y2="52" stroke="#dcdcdc"/><rect x="32" y="29" width="14" height="14" rx="3" fill="#75aadb"/><text x="54" y="41" font-size="13" fill="#222">RStudio: Review Changes</text><text x="736" y="41" font-size="13" fill="#333">&#x2014;</text><rect x="774" y="31" width="10" height="10" fill="none" stroke="#333"/><text x="812" y="42" font-size="15" fill="#333">&#x2715;</text><text x="34" y="70" font-size="12.5" fill="#333">○ Changes   ◉ History</text><text x="230" y="70" font-size="12.5" fill="#333">⎇ main ▾    (all commits) ▾    Filter by File...</text><rect x="30" y="82" width="800" height="150" fill="#fff" stroke="#ccd"/><text x="40" y="100" font-size="12" fill="#5d6b75">Subject                                                     Author              Date          SHA</text><text x="40" y="122" font-size="12.5" fill="#222">Explain the order of the scripts in the README</text><text x="475" y="122" font-size="12.5" fill="#222">Fara Rasoa</text><text x="625" y="122" font-size="12.5" fill="#222">2025-05-12</text><text x="740" y="122" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">cb39eea</text><text x="40" y="144" font-size="12.5" fill="#222">Boxplots of coral cover per year</text><text x="475" y="144" font-size="12.5" fill="#222">Fara Rasoa</text><text x="625" y="144" font-size="12.5" fill="#222">2025-05-12</text><text x="740" y="144" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">e0ed893</text><rect x="31" y="151" width="798" height="21" fill="#cce4f7"/><text x="40" y="166" font-size="12.5" fill="#222">Lower the bleaching threshold to 20 %</text><text x="475" y="166" font-size="12.5" fill="#222">Hery Nirina</text><text x="625" y="166" font-size="12.5" fill="#222">2025-05-09</text><text x="740" y="166" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">4a5c8d0</text><text x="40" y="188" font-size="12.5" fill="#222">Flag severe bleaching</text><text x="475" y="188" font-size="12.5" fill="#222">Hery Nirina</text><text x="625" y="188" font-size="12.5" fill="#222">2025-05-05</text><text x="740" y="188" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">8c390f6</text><text x="40" y="210" font-size="12.5" fill="#222">Add the cleaning script</text><text x="475" y="210" font-size="12.5" fill="#222">Fara Rasoa</text><text x="625" y="210" font-size="12.5" fill="#222">2025-05-02</text><text x="740" y="210" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">06d0e2b</text><rect x="30" y="240" width="800" height="150" fill="#fff" stroke="#ccd"/><text x="40" y="258" font-size="12" fill="#5d6b75">SHA 4a5c8d0 · Author Hery Nirina · Date 2025-05-09   R/03_bleaching.R   (View file @ 4a5c8d0)</text><rect x="31" y="271" width="798" height="22" fill="#ffebe9"/><text x="44" y="286" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">- bleach_threshold &lt;- 30   # % of colonies bleached = severe</text><rect x="31" y="295" width="798" height="22" fill="#e6ffec"/><text x="44" y="310" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">+ bleach_threshold &lt;- 20   # changed after the meeting with the MPA managers</text><text x="44" y="334" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">  reef$severe &lt;- reef$bleached_pct &gt;= bleach_threshold</text><circle cx="160" cy="66" r="11" fill="#d9694a"/><text x="160" y="70.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><circle cx="30" cy="166" r="11" fill="#d9694a"/><text x="30" y="170.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><circle cx="760" cy="258" r="11" fill="#d9694a"/><text x="760" y="262.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><circle cx="870" cy="60" r="11" fill="#d9694a"/><text x="870" y="64.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text class="en" x="888" y="65" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">Git pane → History (clock icon),</tspan><tspan x="888" dy="16">or Changes/History at the top.</tspan></text><text class="fr" x="888" y="65" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">Panneau Git → History (icône horloge),</tspan><tspan x="888" dy="16">ou Changes/History en haut.</tspan></text><circle cx="870" cy="130" r="11" fill="#d9694a"/><text x="870" y="134.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text class="en" x="888" y="135" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">One line per commit: what, who, when,</tspan><tspan x="888" dy="16">and its code (SHA). Click a commit…</tspan></text><text class="fr" x="888" y="135" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">Une ligne par commit : quoi, qui, quand,</tspan><tspan x="888" dy="16">et son code (SHA). Cliquez sur un commit…</tspan></text><circle cx="870" cy="210" r="11" fill="#d9694a"/><text x="870" y="214.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text class="en" x="888" y="215" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">…to see what it changed. &quot;View file&quot;</tspan><tspan x="888" dy="16">shows the whole file as it was then.</tspan><tspan x="888" dy="16">&quot;Filter by File&quot; keeps the commits of</tspan><tspan x="888" dy="16">one file.</tspan></text><text class="fr" x="888" y="215" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">…pour voir ce qu&#x27;il a changé. « View file »</tspan><tspan x="888" dy="16">montre le fichier entier tel qu&#x27;il était.</tspan><tspan x="888" dy="16">« Filter by File » garde les commits</tspan><tspan x="888" dy="16">d&#x27;un seul fichier.</tspan></text>
</svg>
