<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" role="img" aria-label="First Git configuration in the RStudio Terminal" font-family="Segoe UI, Source Sans 3, Arial, Helvetica, sans-serif">
<rect x="20" y="20" width="760" height="300" rx="8" fill="#fff" stroke="#8a969c" stroke-width="1.5"/><rect x="20" y="20" width="760" height="32" rx="8" fill="#f3f3f3"/><rect x="20" y="44" width="760" height="8" fill="#f3f3f3"/><line x1="20" y1="52" x2="780" y2="52" stroke="#dcdcdc"/><rect x="32" y="29" width="14" height="14" rx="3" fill="#75aadb"/><text x="54" y="41" font-size="13" fill="#222">RStudio</text><text x="676" y="41" font-size="13" fill="#333">&#x2014;</text><rect x="714" y="31" width="10" height="10" fill="none" stroke="#333"/><text x="752" y="42" font-size="15" fill="#333">&#x2715;</text><rect x="30" y="58" width="87" height="26" fill="#eef1f3" stroke="#ccd"/><text x="42" y="76" font-size="12.5" fill="#222">Console</text><rect x="119" y="58" width="96" height="26" fill="#fff" stroke="#ccd"/><text x="131" y="76" font-size="12.5" fill="#222">Terminal</text><rect x="217" y="58" width="159" height="26" fill="#eef1f3" stroke="#ccd"/><text x="229" y="76" font-size="12.5" fill="#222">Background Jobs</text><text x="388" y="76" font-size="12" fill="#5d6b75">Terminal 1 (Git Bash) ▾</text><rect x="30" y="86" width="740" height="222" fill="#fff" stroke="#ccd"/><text x="42" y="110" font-size="13" fill="#3a8a3a" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">Fara@LAPTOP MINGW64 ~/Documents/R/reef-monitoring (main)</text><text x="42" y="132" font-size="13" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">$ git config --global user.name &quot;Fara Rasoa&quot;</text><text x="42" y="154" font-size="13" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">$ git config --global user.email &quot;fara@example.org&quot;</text><text x="42" y="176" font-size="13" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">$ git config --global init.defaultBranch main</text><text x="42" y="198" font-size="13" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">$ git config --global --list</text><text x="42" y="220" font-size="13" fill="#555" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">user.name=Fara Rasoa</text><text x="42" y="242" font-size="13" fill="#555" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">user.email=fara@example.org</text><text x="42" y="264" font-size="13" fill="#555" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">init.defaultbranch=main</text><text x="42" y="286" font-size="13" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">$ </text><circle cx="800" cy="105" r="11" fill="#d9694a"/><text x="800" y="109.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text class="en" x="818" y="110" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="818" dy="0">Tools → Terminal → New Terminal</tspan><tspan x="818" dy="16">(Alt + Shift + R). Once per computer.</tspan></text><text class="fr" x="818" y="110" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="818" dy="0">Tools → Terminal → New Terminal</tspan><tspan x="818" dy="16">(Alt + Maj + R). Une fois par ordinateur.</tspan></text><circle cx="800" cy="170" r="11" fill="#d9694a"/><text x="800" y="174.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text class="en" x="818" y="175" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="818" dy="0">Your name and the e-mail of</tspan><tspan x="818" dy="16">your GitHub / GitLab account.</tspan></text><text class="fr" x="818" y="175" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="818" dy="0">Votre nom et l&#x27;e-mail de votre</tspan><tspan x="818" dy="16">compte GitHub / GitLab.</tspan></text><circle cx="800" cy="235" r="11" fill="#d9694a"/><text x="800" y="239.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text class="en" x="818" y="240" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="818" dy="0">--list checks what Git knows.</tspan></text><text class="fr" x="818" y="240" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="818" dy="0">--list vérifie ce que Git a retenu.</tspan></text>
</svg>
