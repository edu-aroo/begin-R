<text class="en" x="30" y="40" font-size="17" font-weight="700" fill="#0b3d5c">Point Intercept Transect (PIT): a 25 m tape, one point every 0.5 m = 50 points</text>
<text class="fr" x="30" y="40" font-size="17" font-weight="700" fill="#0b3d5c">Transect à points (PIT) : ruban de 25 m, un point tous les 0,5 m = 50 points</text>
<text class="en" x="30" y="215" font-size="16" fill="#1f2a33">% hard coral cover = (number of HC points / total points) × 100  —  e.g. 3 / 6 × 100 = 50 %</text>
<text class="fr" x="30" y="215" font-size="16" fill="#1f2a33">% couverture de corail dur = (nombre de points HC / total des points) × 100  —  ex. 3 / 6 × 100 = 50 %</text>
<text class="en" x="30" y="242" font-size="14" fill="#5d6b75">HC hard coral · SC soft coral · MA macroalgae · TA turf algae · RB rubble · SD sand</text>
<text class="fr" x="30" y="242" font-size="14" fill="#5d6b75">HC corail dur · SC corail mou · MA macroalgues · TA algues gazonnantes · RB débris · SD sable</text>
