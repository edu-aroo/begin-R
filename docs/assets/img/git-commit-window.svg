<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 510" role="img" aria-label="RStudio Review Changes window" font-family="Segoe UI, Source Sans 3, Arial, Helvetica, sans-serif">
<rect x="20" y="20" width="820" height="470" rx="8" fill="#fff" stroke="#8a969c" stroke-width="1.5"/><rect x="20" y="20" width="820" height="32" rx="8" fill="#f3f3f3"/><rect x="20" y="44" width="820" height="8" fill="#f3f3f3"/><line x1="20" y1="52" x2="840" y2="52" stroke="#dcdcdc"/><rect x="32" y="29" width="14" height="14" rx="3" fill="#75aadb"/><text x="54" y="41" font-size="13" fill="#222">RStudio: Review Changes</text><text x="736" y="41" font-size="13" fill="#333">&#x2014;</text><rect x="774" y="31" width="10" height="10" fill="none" stroke="#333"/><text x="812" y="42" font-size="15" fill="#333">&#x2715;</text><text x="34" y="70" font-size="12.5" fill="#333">◉ Changes   ○ History</text><text x="230" y="70" font-size="12.5" fill="#333">⎇ main ▾</text><text x="470" y="70" font-size="12.5" fill="#2b6cb0">⬇ Pull</text><text x="530" y="70" font-size="12.5" fill="#2f855a">⬆ Push</text><rect x="30" y="82" width="400" height="160" fill="#fff" stroke="#ccd"/><text x="40" y="100" font-size="12" fill="#5d6b75">Staged  Status  Path</text><rect x="46" y="110" width="14" height="14" fill="#0067c0" stroke="#555"/><path d="M49 117 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/><rect x="96" y="109" width="18" height="17" rx="3" fill="#c27a00"/><text x="105" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">M</text><text x="140" y="122" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">R/02_clean.R</text><rect x="46" y="136" width="14" height="14" fill="#0067c0" stroke="#555"/><path d="M49 143 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/><rect x="96" y="135" width="18" height="17" rx="3" fill="#2f855a"/><text x="105" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">A</text><text x="140" y="148" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">R/03_analysis.R</text><rect x="46" y="162" width="14" height="14" fill="#fff" stroke="#555"/><rect x="96" y="161" width="18" height="17" rx="3" fill="#7b8a93"/><text x="105" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">?</text><text x="140" y="174" font-size="12.5" fill="#222" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">notes_field.txt</text><text x="440" y="100" font-size="12.5" fill="#333">Commit message</text><rect x="440" y="106" width="390" height="100" fill="#fff" stroke="#9e9e9e"/><text x="448" y="126" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">Remove duplicated transects of 2026</text><rect x="440" y="216" width="14" height="14" rx="2" fill="#fff" stroke="#555"/><text x="462" y="228" font-size="12.5" fill="#222">Amend previous commit</text><rect x="760" y="212" width="70" height="26" rx="4" fill="#e9e9e9" stroke="#b5b5b5"/><text x="795.0" y="229" text-anchor="middle" font-size="12.5" fill="#222">Commit</text><rect x="30" y="252" width="800" height="226" fill="#fff" stroke="#ccd"/><text x="40" y="270" font-size="12" fill="#5d6b75">R/02_clean.R    Show ◉ Staged ○ Unstaged    Context 5 line ▾</text><text x="44" y="290" font-size="12.5" fill="#57606a" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace"> @@ -3,6 +3,7 @@</text><text x="44" y="314" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">  old &lt;- read.csv(here(&quot;data&quot;, &quot;raw&quot;, &quot;reef_monitoring.csv&quot;))</text><text x="44" y="338" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">  new &lt;- read.csv(here(&quot;data&quot;, &quot;raw&quot;, &quot;reef_monitoring_2026.csv&quot;))</text><rect x="31" y="347" width="798" height="22" fill="#ffebe9"/><text x="44" y="362" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">- new$site_id &lt;- toupper(new$site_id)</text><rect x="31" y="371" width="798" height="22" fill="#e6ffec"/><text x="44" y="386" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">+ new &lt;- distinct(new)                 # rows typed twice</text><rect x="31" y="395" width="798" height="22" fill="#e6ffec"/><text x="44" y="410" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">+ new$site_id &lt;- toupper(new$site_id)</text><text x="44" y="434" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">  all &lt;- bind_rows(old, new)</text><rect x="600" y="450" width="110" height="26" rx="4" fill="#fff" stroke="#b5b5b5"/><text x="655.0" y="467" text-anchor="middle" font-size="12.5" fill="#222">Stage selection</text><rect x="716" y="450" width="110" height="26" rx="4" fill="#fff" stroke="#b5b5b5"/><text x="771.0" y="467" text-anchor="middle" font-size="12.5" fill="#222">Discard selection</text><circle cx="30" cy="118" r="11" fill="#d9694a"/><text x="30" y="122.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><circle cx="640" cy="160" r="11" fill="#d9694a"/><text x="640" y="164.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><circle cx="795" cy="202" r="11" fill="#d9694a"/><text x="795" y="206.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><circle cx="30" cy="330" r="11" fill="#d9694a"/><text x="30" y="334.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><circle cx="600" cy="66" r="11" fill="#d9694a"/><text x="600" y="70.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text><circle cx="870" cy="60" r="11" fill="#d9694a"/><text x="870" y="64.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text class="en" x="888" y="65" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">Tick the files that go together</tspan><tspan x="888" dy="16">in this commit (Staged).</tspan></text><text class="fr" x="888" y="65" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">Cochez les fichiers qui vont</tspan><tspan x="888" dy="16">ensemble dans ce commit (Staged).</tspan></text><circle cx="870" cy="120" r="11" fill="#d9694a"/><text x="870" y="124.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text class="en" x="888" y="125" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">A short sentence saying WHY,</tspan><tspan x="888" dy="16">e.g. &quot;Remove duplicated transects&quot;.</tspan></text><text class="fr" x="888" y="125" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">Une phrase courte qui dit POURQUOI,</tspan><tspan x="888" dy="16">ex. « Supprime les transects en double ».</tspan></text><circle cx="870" cy="180" r="11" fill="#d9694a"/><text x="870" y="184.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text class="en" x="888" y="185" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">Commit: the snapshot is saved on</tspan><tspan x="888" dy="16">YOUR computer only. A window</tspan><tspan x="888" dy="16">confirms it; close it.</tspan></text><text class="fr" x="888" y="185" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">Commit : l&#x27;instantané est enregistré sur</tspan><tspan x="888" dy="16">VOTRE ordinateur seulement. Une fenêtre</tspan><tspan x="888" dy="16">le confirme ; fermez-la.</tspan></text><circle cx="870" cy="260" r="11" fill="#d9694a"/><text x="870" y="264.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text class="en" x="888" y="265" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">Check the changes: green = added,</tspan><tspan x="888" dy="16">red = removed. &quot;Discard&quot; undoes a</tspan><tspan x="888" dy="16">change that was not committed.</tspan></text><text class="fr" x="888" y="265" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">Vérifiez les changements : vert = ajouté,</tspan><tspan x="888" dy="16">rouge = supprimé. « Discard » annule une</tspan><tspan x="888" dy="16">modification non validée.</tspan></text><circle cx="870" cy="340" r="11" fill="#d9694a"/><text x="870" y="344.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text><text class="en" x="888" y="345" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">Then Push to send the commits</tspan><tspan x="888" dy="16">online (and Pull first if you</tspan><tspan x="888" dy="16">work with others).</tspan></text><text class="fr" x="888" y="345" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="888" dy="0">Puis Push pour envoyer les commits</tspan><tspan x="888" dy="16">en ligne (et Pull d&#x27;abord si vous</tspan><tspan x="888" dy="16">travaillez à plusieurs).</tspan></text>
</svg>
