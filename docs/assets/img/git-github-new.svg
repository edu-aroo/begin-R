<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 510" role="img" aria-label="Create a new repository on GitHub" font-family="Segoe UI, Source Sans 3, Arial, Helvetica, sans-serif">
<rect x="20" y="20" width="640" height="470" rx="8" fill="#fff" stroke="#8a969c" stroke-width="1.5"/><rect x="20" y="20" width="640" height="32" rx="8" fill="#f3f3f3"/><rect x="20" y="44" width="640" height="8" fill="#f3f3f3"/><line x1="20" y1="52" x2="660" y2="52" stroke="#dcdcdc"/><rect x="32" y="29" width="14" height="14" rx="3" fill="#24292f"/><text x="54" y="41" font-size="13" fill="#222">Create a new repository - GitHub — Microsoft Edge</text><text x="556" y="41" font-size="13" fill="#333">&#x2014;</text><rect x="594" y="31" width="10" height="10" fill="none" stroke="#333"/><text x="632" y="42" font-size="15" fill="#333">&#x2715;</text><rect x="21" y="53" width="638" height="30" fill="#f6f8fa"/><text x="40" y="73" font-size="12" fill="#57606a">github.com/new</text><text x="50" y="112" font-size="20" font-weight="600" fill="#1f2328">Create a new repository</text><text x="50" y="142" font-size="12.5" fill="#333">Owner *</text><rect x="50" y="148" width="140" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="58" y="165" font-size="12.5" fill="#111" >fara-rasoa ▾</text><text x="198" y="166" font-size="18" fill="#57606a">/</text><text x="212" y="142" font-size="12.5" fill="#333">Repository name *</text><rect x="212" y="148" width="250" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="220" y="165" font-size="12.5" fill="#111" font-family="Consolas, JetBrains Mono, DejaVu Sans Mono, monospace">reef-monitoring</text><text x="50" y="198" font-size="12.5" fill="#333">Description (optional)</text><rect x="50" y="204" width="412" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="58" y="221" font-size="12.5" fill="#111" >Coral reef monitoring of the three MPAs</text><circle cx="57" cy="253" r="7" fill="#fff" stroke="#555"/><text x="72" y="258" font-size="12.5" fill="#222">Public — anyone on the internet can see it</text><circle cx="57" cy="277" r="7" fill="#fff" stroke="#555"/><circle cx="57" cy="277" r="3.5" fill="#0067c0"/><text x="72" y="282" font-size="12.5" fill="#222">Private — you choose who can see and commit</text><rect x="50" y="306" width="14" height="14" rx="2" fill="#0067c0" stroke="#555"/><path d="M53 313 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/><text x="72" y="318" font-size="12.5" fill="#222">Add a README file</text><rect x="50" y="346" width="170" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="58" y="363" font-size="12.5" fill="#111" >Add .gitignore: R ▾</text><rect x="232" y="346" width="170" height="26" rx="3" fill="#fff" stroke="#9e9e9e"/><text x="240" y="363" font-size="12.5" fill="#111" >Choose a license: None ▾</text><rect x="50" y="400" width="160" height="26" rx="4" fill="#1f883d" stroke="#1a7f37"/><text x="130.0" y="417" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="600">Create repository</text><circle cx="480" cy="160" r="11" fill="#d9694a"/><text x="480" y="164.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><circle cx="480" cy="270" r="11" fill="#d9694a"/><text x="480" y="274.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><circle cx="480" cy="314" r="11" fill="#d9694a"/><text x="480" y="318.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><circle cx="225" cy="413" r="11" fill="#d9694a"/><text x="225" y="417.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><circle cx="690" cy="120" r="11" fill="#d9694a"/><text x="690" y="124.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text class="en" x="708" y="125" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Profile picture → Your repositories → New</tspan><tspan x="708" dy="16">(or the + button, top right). Short name,</tspan><tspan x="708" dy="16">no spaces: it will be the project folder.</tspan></text><text class="fr" x="708" y="125" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Photo de profil → Your repositories → New</tspan><tspan x="708" dy="16">(ou le bouton +, en haut à droite). Nom court,</tspan><tspan x="708" dy="16">sans espaces : ce sera le dossier du projet.</tspan></text><circle cx="690" cy="205" r="11" fill="#d9694a"/><text x="690" y="209.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text class="en" x="708" y="210" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Private: only you and the people you invite.</tspan><tspan x="708" dy="16">Free accounts: GitHub Pages needs Public.</tspan></text><text class="fr" x="708" y="210" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Private : vous seul et les personnes invitées.</tspan><tspan x="708" dy="16">Compte gratuit : GitHub Pages demande Public.</tspan></text><circle cx="690" cy="270" r="11" fill="#d9694a"/><text x="690" y="274.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text class="en" x="708" y="275" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Tick README + .gitignore template R:</tspan><tspan x="708" dy="16">the repository is ready to be cloned.</tspan></text><text class="fr" x="708" y="275" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Cochez README + modèle .gitignore R :</tspan><tspan x="708" dy="16">le dépôt est prêt à être cloné.</tspan></text><circle cx="690" cy="335" r="11" fill="#d9694a"/><text x="690" y="339.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text class="en" x="708" y="340" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Then Code ▾ → HTTPS → copy the address</tspan><tspan x="708" dy="16">https://github.com/fara-rasoa/reef-monitoring.git</tspan></text><text class="fr" x="708" y="340" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="708" dy="0">Puis Code ▾ → HTTPS → copiez l&#x27;adresse</tspan><tspan x="708" dy="16">https://github.com/fara-rasoa/reef-monitoring.git</tspan></text>
</svg>
