<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Git Credential Manager sign-in window on Windows" font-family="Segoe UI, Source Sans 3, Arial, Helvetica, sans-serif">
<rect x="20" y="20" width="420" height="290" rx="8" fill="#fff" stroke="#8a969c" stroke-width="1.5"/><rect x="20" y="20" width="420" height="32" rx="8" fill="#f3f3f3"/><rect x="20" y="44" width="420" height="8" fill="#f3f3f3"/><line x1="20" y1="52" x2="440" y2="52" stroke="#dcdcdc"/><rect x="32" y="29" width="14" height="14" rx="3" fill="#24292f"/><text x="54" y="41" font-size="13" fill="#222">Connect to GitHub</text><text x="336" y="41" font-size="13" fill="#333">&#x2014;</text><rect x="374" y="31" width="10" height="10" fill="none" stroke="#333"/><text x="412" y="42" font-size="15" fill="#333">&#x2715;</text><text x="230" y="96" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">GitHub</text><text x="230" y="124" text-anchor="middle" font-size="13" fill="#57606a">Sign in</text><text x="140" y="154" font-size="12.5" fill="#0067c0" font-weight="600">Browser/Device</text><text x="260" y="154" font-size="12.5" fill="#57606a">Token</text><line x1="130" y1="160" x2="245" y2="160" stroke="#0067c0" stroke-width="2"/><rect x="120" y="182" width="220" height="26" rx="4" fill="#1f883d" stroke="#1a7f37"/><text x="230.0" y="199" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="600">Sign in with your browser</text><rect x="120" y="220" width="220" height="26" rx="4" fill="#fff" stroke="#b5b5b5"/><text x="230.0" y="237" text-anchor="middle" font-size="12.5" fill="#222">Sign in with a code</text><text x="230" y="280" text-anchor="middle" font-size="12" fill="#57606a">Don't have an account? Sign up</text><circle cx="350" cy="195" r="11" fill="#d9694a"/><text x="350" y="199.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><circle cx="470" cy="80" r="11" fill="#d9694a"/><text x="470" y="84.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text class="en" x="488" y="85" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="488" dy="0">Windows only asks once: the first Push (or Pull</tspan><tspan x="488" dy="16">of a private repository) opens this window of</tspan><tspan x="488" dy="16">Git Credential Manager (installed with Git).</tspan><tspan x="488" dy="16">Sign in in the browser, authorise, done:</tspan><tspan x="488" dy="16">the password is kept safely by Windows.</tspan></text><text class="fr" x="488" y="85" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="488" dy="0">Windows ne le demande qu&#x27;une fois : le premier Push</tspan><tspan x="488" dy="16">(ou Pull d&#x27;un dépôt privé) ouvre cette fenêtre de</tspan><tspan x="488" dy="16">Git Credential Manager (installé avec Git).</tspan><tspan x="488" dy="16">Connectez-vous dans le navigateur, autorisez, c&#x27;est fait :</tspan><tspan x="488" dy="16">le mot de passe est gardé en sécurité par Windows.</tspan></text><circle cx="470" cy="200" r="11" fill="#d9694a"/><text x="470" y="204.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text class="en" x="488" y="205" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="488" dy="0">GitLab: the same window says &quot;Connect to GitLab&quot;.</tspan><tspan x="488" dy="16">A token also works (Token tab): see below.</tspan></text><text class="fr" x="488" y="205" font-size="13" fill="#0b3d5c" text-anchor="start"><tspan x="488" dy="0">GitLab : la même fenêtre dit « Connect to GitLab ».</tspan><tspan x="488" dy="16">Un jeton marche aussi (onglet Token) : voir plus bas.</tspan></text>
</svg>
